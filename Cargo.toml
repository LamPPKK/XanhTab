[package]
name = "xanhtab"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Zero-account remote browser appliance control plane"
default-run = "xanhtabd"

[lib]
name = "xanhtab"
path = "src/lib.rs"

[[bin]]
name = "xanhtabd"
path = "src/main.rs"

[[bin]]
name = "xanhtab-browser"
path = "src/bin/xanhtab-browser.rs"

[[bin]]
name = "xanhtab-netd"
path = "src/bin/xanhtab-netd.rs"

[[bin]]
name = "xanhtab-blocklist"
path = "src/bin/xanhtab-blocklist.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
data-encoding = "2.9"
fst = "0.4"
futures-util = "0.3"
getrandom = "0.2"
http = "1.3"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.21"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
