name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo run --locked --quiet --bin xanhtabd -- --config config/xanhtab.toml --check-config
      - run: cargo run --locked --quiet --bin xanhtabd -- --config config/xanhtab.production.toml --check-config
      - run: bash -n install.sh scripts/*.sh
      - run: scripts/test-x0-preflight.sh
      - run: scripts/test-x0-encoder-probe.sh
      - run: (cd benchmarks/x0-encoder-2026-08-20 && sha256sum -c SHA256SUMS)
      - run: jq -e '.verdict.status == "no-go" and (.profiles | length == 4) and all(.profiles[]; .passed == false and .classification == "frame-processing-error")' benchmarks/x0-encoder-2026-08-20/summary.json
      - run: scripts/x1-burn-audit.sh --dry-run | jq -e '.dry_run == true and .burn_slo_ms == 5000 and (.base_origin | startswith("https://")) and (.runtime_dir | startswith("/run/")) and (.output | startswith("/run/")) and (keys == ["base_origin", "browser_service", "burn_slo_ms", "dry_run", "output", "runtime_dir", "schema_version"])'
      - run: '! scripts/x1-burn-audit.sh --dry-run --base-url https://user@xanhtab.local:8443'
      - run: '! scripts/x1-burn-audit.sh --dry-run --output /run/../tmp/audit.json'
      - run: npm run test:schemas
      - run: node --check web/app.js
